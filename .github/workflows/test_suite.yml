# Workflow to run the test suite for the project
name: Test suite

# Controls when the workflow will run
on:
  # Triggers the workflow on pushes to the "main" branch, i.e., PR merges
  push:
    branches: [ "main" ]

  # Triggers the workflow on pushes to open pull requests with source changes
  pull_request:
    paths:
      - '.github/workflows/test_suite.yml'
      - 'src/*.f90'
      - '**/*.sh'
      - 'requirements-dev.txt'
      - 'CMakeLists.txt'
      - 'test/input/*.nc'
      - 'test/input/*.nml'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Helps prevent parallel runs of the workflow from overlapping
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Write permissions are not needed for all jobs in this workflow
permissions: {}

# Workflow run - one or more jobs that can run sequentially or in parallel
jobs:
  # Run the project test suite
  test-suite:
    name: ${{ matrix.FC }} ${{ matrix.version }}, ${{ matrix.std }}
    # The type of runner that the job will run on
    runs-on: ubuntu-24.04
    # The timeout minutes for the job to complete
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        toolchain: [intel-ifx, intel-ifort]
        include:
          - toolchain: intel-ifx
            FC: ifx
            version: 2025.3.2
          - toolchain: intel-ifort
            FC: ifort
            version: 2024.2.0  # Last release of oneapi with ifort
        std: [f08]

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checkout your repository under $GITHUB_WORKSPACE so your job can access it
      - name: Checkout code
        with:
          persist-credentials: false
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Intel tools
        uses: rscohn2/setup-oneapi@9ac2e22dab93541676ee39841d702c35ee0b8e4c # v0.2.0
        with:
          components: |
            icx@${{ matrix.version }}
            ifx@${{ matrix.version }}

      - name: Setup Intel oneAPI environment
        run: |
          source /opt/intel/oneapi/setvars.sh
          printenv >> ${GITHUB_ENV}

      - name: Install NetCDF C library
        run: |
          sudo apt-get update
          sudo apt-get install -y libnetcdf-dev netcdf-bin

      - name: Build NetCDF Fortran with Intel compiler
        run: |
          NFVERSION=4.6.1
          wget -q "https://github.com/Unidata/netcdf-fortran/archive/refs/tags/v${NFVERSION}.tar.gz" \
            -O /tmp/netcdf-fortran.tar.gz
          tar xf /tmp/netcdf-fortran.tar.gz -C /tmp
          cmake -S /tmp/netcdf-fortran-${NFVERSION} \
                -B /tmp/netcdf-fortran-build \
                -DCMAKE_Fortran_COMPILER="${{ matrix.FC }}" \
                -DCMAKE_C_COMPILER=gcc \
                -DCMAKE_PREFIX_PATH=/usr \
                -DCMAKE_INSTALL_PREFIX=/opt/netcdf-fortran \
                -DBUILD_SHARED_LIBS=OFF \
                -DENABLE_TESTS=OFF
          cmake --build /tmp/netcdf-fortran-build -j$(nproc)
          sudo cmake --install /tmp/netcdf-fortran-build
          echo "/opt/netcdf-fortran/bin" >> "${GITHUB_PATH}"

      - name: Build MESC
        env:
          FORTRAN_STANDARD: ${{ matrix.std }}
        run: |
          cmake -B build -DCMAKE_Fortran_COMPILER="${{ matrix.FC }}" \
          -DCMAKE_PREFIX_PATH=/opt/netcdf-fortran:/usr \
          -DNetCDFFortran_ROOT=/opt/netcdf-fortran
          cmake --build build -j

      - name: Run test suite
        run: |
          cd test
          ./run_main.sh
